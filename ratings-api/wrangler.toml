name = "ratings-api"
main = "src/index.ts"
compatibility_date = "2026-09-14"

[vars]
ENVIRONMENT = "production"
DOUBAN_ENABLED = "true"
MDBLIST_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "ratings-db"
database_id = "8633e6e9-c52d-4424-878c-39c835aa8a9e"
migrations_dir = "migrations"

# Optional KV can be added for cross-isolate rate limiting in a future version.
# [[kv_namespaces]]
# binding = "RATINGS_KV"
# id = "..."
